[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old URLs -> new sections (Stills = /, Motion, Stories).
[[redirects]]
  from = "/work"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/reel"
  to = "/motion"
  status = 301
  force = true

[[redirects]]
  from = "/editorial"
  to = "/stories"
  status = 301
  force = true

[[redirects]]
  from = "/personal"
  to = "/stories"
  status = 301
  force = true

# Astro generates dist/404.html, which Netlify serves automatically
# for any unmatched path. No explicit redirect needed.
